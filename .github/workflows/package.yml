name: Package

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

# Least-privilege: zipping the source needs no write scope and no secrets.
permissions:
  contents: read

jobs:
  # ===========================================
  # Device-independent gates (must pass before publishing)
  # ===========================================

  lint-bsc:
    name: brighterscript type-check
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: brighterscript (zero-error gate)
        run: npx bsc --project bsconfig.json

  lint-validate-xml:
    name: Validate XML files
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate XML files
        run: make validate-xml

  lint-validate-manifest:
    name: Validate manifest
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate manifest
        run: make validate-manifest

  lint-verify-runtime:
    name: verify-runtime checks
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Checkout phlix-server (Check 14 ENUM reference)
        run: git clone --depth 1 --branch master https://github.com/detain/phlix-server.git ../phlix-server
      - name: verify-runtime checks
        run: make verify-runtime

  # M-ROKU-23 (review roku__devops): the published `latest` used to be gated
  # only by the four static legs — the device-free BrightScript unit suite
  # lived solely in the Tests workflow, and Actions cannot `needs` across
  # workflows, so a master push with unit RED still shipped the broken zip
  # as the single QA-channel pointer. The gate runs here too (it is
  # device-free by design — same command the Tests workflow runs).
  lint-headless-unit:
    name: Headless BrightScript unit gate
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Headless BrightScript unit gate (brs)
        run: node tests/scripts/run-headless-unit.mjs

      - name: npm audit gate (RT-088)
        # Same gate as Tests/Lint workflows; runs here too because M-ROKU-23
        # law is that every publish-blocking device-free leg lives in THIS
        # workflow's needs-chain (the audit verdict gates the zip as much as
        # the unit battery does).
        run: |
          npm run audit-self-test
          npm run audit

  # ===========================================
  # Device-dependent gates (run when ROKU_HOST is set, do NOT block publishing)
  # ===========================================

  test-unit:
    name: Unit tests (device-dependent)
    runs-on: ubuntu-26.04
    env:
      ROKU_HOST: ${{ secrets.ROKU_HOST }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        if: env.ROKU_HOST != ''
        run: make test-unit

  # ===========================================
  # Package and release
  # ===========================================

  package:
    name: Build sideload package
    needs: [lint-bsc, lint-validate-xml, lint-validate-manifest, lint-verify-runtime, lint-headless-unit]
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build sideload zip (manifest + source + images)
        run: make package

      - name: Verify sideload zip layout (C08 — root manifest or Roku rejects it)
        # make package self-verifies, but this job uploads and release-latest
        # publishes the artifact: name the assert where the bytes ship.
        # Red-leg proven in scripts/verify-package.sh's header contract (the
        # OLD build/manifest layout reddens root-manifest + build-entries legs).
        run: make verify-package

      - name: Record sideload digest (M-ROKU-20)
        # 'make package' already wrote phlix.zip.sha256 from the same bytes;
        # this step RE-DERIVES it independently and fails loudly on drift, so
        # the published digest is proven against the artifact as uploaded.
        run: |
          sha256sum -c phlix.zip.sha256
          sha256sum phlix.zip

      - name: Upload sideload package
        uses: actions/upload-artifact@v7
        with:
          name: phlix-roku-sideload
          path: |
            phlix.zip
            phlix.zip.sha256
          if-no-files-found: error

  # (M-ROKU-10) A `package-signed` job used to live here. It ran
  # `make package-signed` in a job that installed no signer (no setup-node /
  # npm ci, so neither rokudev nor rokupkg existed) and collected no artifact
  # — silently skipped while its gate secret was unset, and the day anyone
  # armed the secret it would have failed and blocked release-latest, which
  # listed it under `needs`. Store signing requires Roku-issued credentials,
  # so packaging stays a manual workstation step (docs/publishing.md).
  # Re-add CI signing only WITH signer provisioning (npm ci + the literal
  # `rokudev` token Check 41 R4 pins — note no public package provides that
  # CLI (npm 404, review CR-4), so re-arming needs a real signer shipped
  # under that name or the R4 pin rotated in the same change — plus cert
  # handling) in the same job — verify-runtime Check 41 R4 reddens a job that
  # runs `make package-signed` without a provisioned signer.

  release-latest:
    name: Update "latest" prerelease
    needs: package
    # On every master/main push, overwrite a rolling "latest" GitHub Release
    # carrying the RAW sideload phlix.zip as a directly-downloadable asset
    # (GitHub Actions artifacts are re-zipped on download — a Release serves the
    # bare sideload zip Roku's Dev Application Installer expects). Skipped on PRs.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-26.04
    # ROK-31: the reset-then-publish sequence (delete release+tag, recreate) is
    # not atomic; two overlapping master pushes could interleave and leave the
    # rolling "latest" release missing or mislabeled. Serialize them; queue
    # (never cancel) so a mid-publish run is not killed half-done.
    concurrency:
      group: roku-release-latest
      cancel-in-progress: false
    # Override the read-only default above: publishing a Release needs write.
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download sideload package
        uses: actions/download-artifact@v8
        with:
          name: phlix-roku-sideload
          path: artifacts

      - name: Reset "latest" release + tag
        run: |
          # RT-010: probe first, then delete LOUD. The old `|| true` shrugged
          # at transient gh failures: the delete silently no-op'd and the new
          # assets attached to yesterday's stale tag anyway. A failure here
          # now fails the job instead of mislabeling a release.
          if gh release view latest >/dev/null 2>&1; then
            gh release delete latest --yes --cleanup-tag
          else
            echo "no 'latest' release yet (first-ever publish) - nothing to reset"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish "latest" prerelease
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: latest
          name: Latest (master)
          body: |
            Rolling build of the latest `master` commit (${{ github.sha }}).
            - **`phlix.zip`** — Roku sideload package. Upload it directly via the
              Roku device's Development Application Installer (no zip wrapper).
            - **`phlix.zip.sha256`** — digest of the exact bytes above (the build
              is deterministic: same tree ⇒ same zip); check with
              `sha256sum -c phlix.zip.sha256`.
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          files: |
            artifacts/phlix.zip
            artifacts/phlix.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
