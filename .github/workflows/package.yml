name: Package

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

# Least-privilege: zipping the source needs no write scope and no secrets.
permissions:
  contents: read

jobs:
  # ===========================================
  # Device-independent gates (must pass before publishing)
  # ===========================================

  lint-bsc:
    name: brighterscript type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: brighterscript (zero-error gate)
        run: npx bsc --project bsconfig.json

  lint-validate-xml:
    name: Validate XML files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate XML files
        run: make validate-xml

  lint-validate-manifest:
    name: Validate manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate manifest
        run: make validate-manifest

  lint-verify-runtime:
    name: verify-runtime checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: verify-runtime (informational — may have false positives)
        run: make verify-runtime || true

  # ===========================================
  # Device-dependent gates (run when ROKU_HOST is set, do NOT block publishing)
  # ===========================================

  test-unit:
    name: Unit tests (device-dependent)
    runs-on: ubuntu-latest
    if: env.ROKU_HOST != ''
    env:
      ROKU_HOST: ${{ secrets.ROKU_HOST }}
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: make test-unit

  # ===========================================
  # Package and release
  # ===========================================

  package:
    name: Build sideload package
    needs: [lint-bsc, lint-validate-xml, lint-validate-manifest, lint-verify-runtime]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build sideload zip (manifest + source + images)
        run: make package

      - name: Upload sideload package
        uses: actions/upload-artifact@v4
        with:
          name: phlix-roku-sideload
          path: phlix.zip
          if-no-files-found: error

  package-signed:
    name: Build signed package (device-dependent)
    needs: package
    runs-on: ubuntu-latest
    env:
      ROKU_HOST: ${{ secrets.ROKU_HOST }}
    if: secrets.ROKU_HOST != ''
    steps:
      - uses: actions/checkout@v6
      - name: Build signed package
        run: make package-signed

  release-latest:
    name: Update "latest" prerelease
    needs: [package, package-signed]
    # On every master/main push, overwrite a rolling "latest" GitHub Release
    # carrying the RAW sideload phlix.zip as a directly-downloadable asset
    # (GitHub Actions artifacts are re-zipped on download — a Release serves the
    # bare sideload zip Roku's Dev Application Installer expects). Skipped on PRs.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    # Override the read-only default above: publishing a Release needs write.
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download sideload package
        uses: actions/download-artifact@v4
        with:
          name: phlix-roku-sideload
          path: artifacts

      - name: Reset "latest" release + tag
        run: gh release delete latest --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish "latest" prerelease
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e
        with:
          tag_name: latest
          name: Latest (master)
          body: |
            Rolling build of the latest `master` commit (${{ github.sha }}).
            - **`phlix.zip`** — Roku sideload package. Upload it directly via the
              Roku device's Development Application Installer (no zip wrapper).
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          files: artifacts/phlix.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
