name: Lint

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: brighterscript (zero-error gate)
        run: npx bsc --project bsconfig.json

      - name: bslint (hard gate - fails on any issue)
        run: make bslint

      - name: Validate XML files
        run: make validate-xml

      - name: Checkout phlix-server (Check 14 ENUM reference)
        run: git clone --depth 1 --branch master https://github.com/detain/phlix-server.git ../phlix-server

      - name: verify-runtime (hard gate - fails on any issue)
        run: make verify-runtime
