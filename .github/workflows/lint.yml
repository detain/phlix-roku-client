name: Lint

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: brighterscript (zero-error gate)
        run: npx bsc --project bsconfig.json

      - name: Validate XML files
        run: make validate-xml

      - name: verify-runtime (informational — may have false positives)
        run: make verify-runtime || true
