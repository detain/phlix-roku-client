name: Tests

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  test:
    runs-on: ubuntu-26.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Headless BrightScript unit gate (brs)
        # M-ROKU-17: this used to be 'make test-unit' gated behind
        # 'if: env.ROKU_HOST != ""' — and the job never defined ROKU_HOST, so
        # the step could not execute even with the secret set. The gate now
        # runs device-free (pure-logic suites in the brs interpreter; the
        # device-only suites are excluded there with per-item reasons).
        run: node tests/scripts/run-headless-unit.mjs

      - name: npm audit gate (RT-088)
        # Documented allow-list (scripts/audit-gate.mjs): the seven allowed
        # advisories are all brs@0.45.0-subtree dev-chain entries with NO
        # reachable fix (proofs printed on every run); ANY other advisory —
        # at any severity — reddens this step, unlike a bare
        # --audit-level=moderate. Self-test + mirror tests first: a neutered
        # decision layer fails the job even if a green audit shrugs.
        run: |
          npm run audit-self-test
          npm run test-audit-gate
          npm run audit

      - name: Run lint
        run: |
          make lint

      - name: Route manifest gate (S280)
        run: |
          make validate-routes

      - name: Validate manifest
        run: |
          make validate-manifest

      - name: Check prerequisites
        run: |
          make check-strict
